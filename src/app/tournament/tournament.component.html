<div class="tournament-header" *ngIf="tournament">
  <span class="tournament-header-item">
    Date: {{ tournament.date | date: "yyyy-MM-dd" }}
  </span>
  <span class="tournament-header-item"> State: {{ tournament.state }} </span>
  <span class="tournament-header-item">
    Round: {{ tournament.roundIndex }}
  </span>
</div>

<mat-tab-group animationDuration="0ms" [(selectedIndex)]="selectedIndex">
  <mat-tab label="Players">
    <app-tournament-players
      [tournament]="tournament"
      (tournamentChangeEvent)="onTournamentChangedEvent($event)"
    ></app-tournament-players>
  </mat-tab>
  <mat-tab label="Matches">
    <app-tournament-matches
      [tournament]="tournament"
      (matchesChangedEvent)="onMatchesChangedEvent()"
      (tournamentChangeEvent)="onTournamentChangedEvent($event)"
    ></app-tournament-matches>
  </mat-tab>
  <mat-tab label="Standings">
    <app-tournament-standings
      [tournament]="tournament"
      [matchesChangedCounter]="matchesChangedCounter"
    ></app-tournament-standings>
  </mat-tab>
</mat-tab-group>
