<div *ngIf="tournament">
  <h2>Add Players to Tournament</h2>

  <form class="example-form" (ngSubmit)="addPlayerToTournament()">
    <mat-form-field class="example-full-width">
      <input
        type="text"
        placeholder="Select Player"
        aria-label="playerName"
        matInput
        [formControl]="playersNotInTournamentFormControl"
        [matAutocomplete]="auto"
      />
      <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
        <mat-option
          *ngFor="
            let playerName of filteredPlayersNotInTournamentOptions | async
          "
          [value]="playerName"
        >
          {{ playerName }}
        </mat-option>
      </mat-autocomplete>
    </mat-form-field>

    <button mat-raised-button type="submit" color="primary">Add</button>
  </form>

  <h2>Players In Tournament</h2>

  <table mat-table [dataSource]="playersInTournament" class="mat-elevation-z8">
    <ng-container matColumnDef="position">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Num.</th>
      <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}.</td>
    </ng-container>

    <ng-container matColumnDef="name">
      <td mat-cell *matCellDef="let player">{{ player.name }}</td>
    </ng-container>

    <ng-container matColumnDef="delete">
      <td mat-cell *matCellDef="let player">
        <button
          mat-mini-fab
          color="warn"
          (click)="removePlayerFromTournament(player)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr
      mat-row
      *matRowDef="let row; columns: ['position', 'name', 'delete']"
    ></tr>
  </table>

  <div
    *ngIf="
      tournament && tournament.state === tournamentState.INITIALIZING
    "
    class="start-actions"
  >
    <button
      mat-raised-button
      color="primary"
      (click)="startTournament(tournament.id)"
    >
      Determine Seating
    </button>
  </div>

  <div
    *ngIf="
      playersOrderedBySeatingOrder &&
      playersOrderedBySeatingOrder.length > 0
    "
    class="seating-wrapper"
  >
    <h2>Seating Order</h2>
    <div
      class="seating-circle"
      [style.width.px]="seatingRadius * 2 + 96"
      [style.height.px]="seatingRadius * 2 + 96"
    >
      <div class="seating-table">Table</div>
      <div
        *ngFor="let player of playersOrderedBySeatingOrder; let i = index"
        class="seat"
        [style.--i]="i"
        [style.--n]="seatingSize"
        [style.--radius.px]="seatingRadius"
        [title]="'Seat ' + (i + 1)"
      >
        <span class="seat-name">{{ player.name }}</span>
      </div>
    </div>
  </div>
</div>
